
<div class="container-fluid">
    <div class="container">
        <div class="row pb-3">
            <div class="col-12">
                <h1 class="display-6">Settings</h1>
            </div>
        </div>
        <div class="d-flex flex-column">
            <div class="col-12 col-md-6 col-lg-4">
                    <!-- Availability -->
                    <div class="form-check form-switch pb-3 fs-3">
                        <input [(ngModel)]="settings.eggsAvailable" id="eggsAvailable" class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
                        <label class="form-check-label fs-6" for="eggsAvailable">
                            Eggs Available
                        </label>
                    </div>
                    <!-- Price -->
                    <div class="input-group my-3">
                        <span class="input-group-text"><fa-icon class="px-2" [icon]="faDollarSign"></fa-icon></span>
                        <div class="form-floating">
                            <input [(ngModel)]="settings.unitEggPrice" id="name" type="text" class="form-control" placeholder=" "/>
                            <label for="name">Current Price Per Dozen</label>
                        </div>
                    </div>
                    <!-- Submit -->
                    <div class="d-flex gap-2 justify-content-start">
                        <button (click)="saveSettings()" type="submit" class="btn btn-success flex-grow-1 flex-md-grow-0"><fa-icon class="" [icon]="faCheck"></fa-icon> Save</button>
                        <button class="btn btn-outline-dark flex-grow-1 flex-md-grow-0" ><fa-icon class="" [icon]="faXmark"></fa-icon> Cancel</button>
                    </div>
            </div>
        </div>
    </div>
</div>
