
<div class="container-fluid">
    <div class="container d-flex gap-3 flex-column">
        <div class="row">
            <div class="col-12">
                <h1 class="display-6">Settings</h1>
            </div>
        </div>
        <div class="card card-body shadow rounded-4 border-0">
            <div class="row pb-3">
                <div class="col-12">
                    <h4 class="">Storefront</h4>
                </div>
            </div>
            <div class="d-flex flex-column">
                <div class="row">
                    <div class="col-12 col-md-6 col-lg-4">
                        <!-- Availability -->
                        <div class="form-check form-switch pb-3 fs-3">
                            <input [(ngModel)]="settings.eggsAvailable" id="eggsAvailable" class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
                            <label class="form-check-label fs-6" for="eggsAvailable">
                                Eggs Available
                            </label>
                        </div>
                        <!-- Price -->
                        <div class="input-group my-3">
                            <span class="input-group-text"><fa-icon class="px-2" [icon]="faDollarSign"></fa-icon></span>
                            <div class="form-floating">
                                <input [(ngModel)]="settings.unitEggPrice" id="name" type="text" class="form-control" placeholder=" "/>
                                <label for="name">Current Price Per Dozen</label>
                            </div>
                        </div>
                        <!-- Submit -->
                        <div class="d-flex gap-2 justify-content-start">
                            <button (click)="saveSettings()" type="submit" class="btn btn-success flex-grow-1 flex-md-grow-0"><fa-icon class="me-2" [icon]="faCheck"></fa-icon>Update Storefront</button>
                            <button class="btn btn-outline-secondary flex-grow-1 flex-md-grow-0" ><fa-icon class="me-2" [icon]="faXmark"></fa-icon>Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card card-body shadow rounded-4 border-0">
            <div class="row pb-3">
                <div class="col-12">
                    <h4 class="">Admins</h4>
                </div>
            </div>
            <div class="d-flex flex-column">
                <div class="row">
                    <div class="col-12">
                        <div class="table-responsive">
                            <table class="table table-hover mb-3">
                                <thead>
                                    <tr>
                                    <th>ID</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Created</th>
                                    <th></th>
                                    </tr>
                                </thead>

                                <tbody *ngIf="admins">
                                    <tr *ngFor="let admin of admins">
                                        <td>{{ admin.id }}</td>
                                        <td>{{ admin.email }}</td>
                                        <td>
                                        <span class="badge bg-primary">
                                            {{ admin.role }}
                                        </span>
                                        </td>
                                        <td>
                                        {{ admin.createdAt | date:'medium' }}
                                        </td>
                                        <td>
                                        <button [disabled]="admin.id === 1" class="btn btn-sm btn-outline-danger border-0" (click)="deleteAdmin(admin)"><fa-icon [icon]="faTrash"></fa-icon></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <button (click)="showAddAdmin = true" *ngIf="!showAddAdmin" class="btn btn-outline-primary border-0" ><fa-icon class="me-2" [icon]="faCirclePlus"></fa-icon>Create Admin</button>
                        <div class="row">
                            <div *ngIf="showAddAdmin" [formGroup]="addAdminForm" class="mt-3">
                            
                            <h5><fa-icon class="me-2" [icon]="faCirclePlus"></fa-icon>Create Admin</h5>

                            <div class="mb-2">
                                <label>Email</label>
                                <input class="form-control" formControlName="email">
                            </div>

                            <div class="mb-2">
                                <label>Password</label>
                                <input type="password" class="form-control" formControlName="password">
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" (click)="addAdmin()">
                                Create
                                </button>

                                <button class="btn btn-secondary" (click)="showAddAdmin = false">
                                Cancel
                                </button>
                            </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card card-body shadow rounded-4 border-0">
            <div class="row pb-3">
                <div class="col-12">
                    <h4 class="">Edit Your Profile</h4>
                </div>
            </div>
            <div class="d-flex flex-column">
                <div class="row">
                    <div class="col-12 col-md-6 col-lg-4">
                        <form [formGroup]="accountForm" (ngSubmit)="updateAccount()">
                            <div class="mb-3">
                                <label>Email</label>
                                <input class="form-control" formControlName="email" />
                            </div>
                            <div class="mb-3">
                                <label>Current Password</label>
                                <input type="password" class="form-control" formControlName="currentPassword" />
                            </div>
                            <div class="mb-3">
                                <label>New Password</label>
                                <input type="password" class="form-control" formControlName="newPassword" />
                            </div>
                            <button class="btn btn-success" type="submit">
                                <fa-icon class="me-2" [icon]="faCheck"></fa-icon>
                                Update Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
