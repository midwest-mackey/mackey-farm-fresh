
<div class="container-fluid">
    <div class="container">
        <div class="row pb-3">
            <div class="col-12">
                <h1 class="display-6">All Orders</h1>
            </div>
        </div>
        <div class="row">
            <div *ngIf="loading" class="col-12 text-center m-5">
                <p >Loading...</p>
                <p *ngIf="!loading && orders.length === 0" class="col-12 text-center m-5">No orders yet.</p>
            </div>
        </div>
        
        <div *ngIf="!loading && orders.length > 0" class="d-flex flex-column gap-3">
            <div *ngFor="let order of orders" class="">
                <div class="col-12 card shadow rounded-4 border-0">
                    <div class="card-body" (click)="startEdit(order)">
                        <div class="row d-flex align-items-center">
                            <div class="col-auto pe-0 position-relative">
                                <img src="assets/chicken-party.png" class="" width="70" />
                            </div>
                            <div class="col">
                                <small class="text-muted">{{ order.createdAt | date:'mediumDate' }}</small>
                                <h2 class="m-0">{{ order.name }}</h2>
                                <h5 class="m-0 sigmar-regular">{{ order.dozenCount }} dozen</h5>
                                <small class="text-muted">Pickup: {{ order.pickupDate }} | {{ order.paymentType }}</small>
                            </div>
                            <div class="col-auto">
                                <h5 class="m-0"><span class="badge" [ngClass]="getStatusClass(order.status)">{{ order.status }}</span></h5>
                            </div>
                        </div>
                        <button class="btn btn-link-dark position-absolute top-0 end-0"><fa-icon class="" [icon]="faEdit"></fa-icon></button>
                    </div>
                    <!-- EXPANDED EDIT -->
                    <div class="card-footer bg-light" *ngIf="editingOrderId === order.id">
                        <div class="d-flex flex-wrap gap-2 mb-3 justify-content-center">
                            <h3 class *ngFor="let status of statuses">
                                <span type="button" class="badge badge-outline"
                                    [ngClass]="{'text-bg-success': selectedStatus === status,'text-bg-secondary': selectedStatus !== status}"
                                    (click)="selectedStatus = status">
                                    {{ status }}
                                </span>
                            </h3>
                        </div>

                        <div class="d-flex gap-2 justify-content-center">
                            <button class="btn btn-success flex-grow-1 flex-md-grow-0" (click)="saveStatus(order)"><fa-icon class="" [icon]="faCheck"></fa-icon> Save</button>
                            <button class="btn btn-outline-secondary flex-grow-1 flex-md-grow-0" (click)="cancelEdit()"><fa-icon class="" [icon]="faXmark"></fa-icon> Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
