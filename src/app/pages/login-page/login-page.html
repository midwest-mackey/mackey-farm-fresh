
<div id="app-shell" class="container d-flex justify-content-top align-items-center">
  <nav class="navbar bg-warning">
    <div class="container-fluid justify-content-center">
      <a routerLink="/">
        <img src="assets/logo.png" alt="Logo" width="180"  class="d-inline-block align-text-center">
      </a>
    </div>
  </nav>
  
  <div class="card border-0 rounded-4 shadow-lg col-12 col-sm-10 col-md-8 my-3 col-lg-4 p-4 text-center">
    <div class="card-body">
      <h3 class="fw-light mb-4">Admin Login</h3>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <!-- email -->
        <div class="form-floating mb-2">
          <input id="email" type="text" class="form-control" placeholder=" " formControlName="email" autocapitalize="off" [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"/>
          <label for="email">Email</label>
          <div class="invalid-feedback">Email is required</div>
        </div>
        <!-- Password -->
        <div class="form-floating mb-4">
          <input id="password" type="password" class="form-control" placeholder=" " formControlName="password" autocapitalize="off" [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"/>
          <label for="password">Password</label>
          <div class="invalid-feedback">Password is required</div>
        </div>
        <!-- Submit -->
          <button class="btn btn-warning btn-lg w-100" type="submit">Login</button>
        <!-- Auth error -->
        <div *ngIf="error" class="text-danger mt-2 text-center">Invalid credentials</div>
      </form>
    </div>
  </div>
  <a routerLink="/" class="btn btn-outline-dark border-0 py-0 mt-3 rounded-pill mb-auto d-flex align-items-center"><fa-icon class="me-2" [icon]="faArrowLeft"></fa-icon><img src="assets/chicken.png" width="40"/> storefront</a>
  <footer class="text-center mt-auto">
    <p class="small text-muted mb-5">Mackey's Farm Fresh Eggs™ © 2026</p>
  </footer>
</div>
