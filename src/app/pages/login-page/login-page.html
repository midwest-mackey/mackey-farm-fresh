<div class="container">
  <div class="row d-flex justify-content-center align-items-start">

    <div class="card border-0 rounded-4 shadow-lg col-12 col-sm-10 col-md-8 col-lg-6 my-5 p-3 p-sm-5">

      <div class="card-body">

        <h1 class="text-center mb-5 display-6">Admin Login</h1>

        <form [formGroup]="loginForm" (ngSubmit)="login()">

          <!-- Username -->
          <div class="form-floating mb-3">
            <input
              id="username"
              type="text"
              class="form-control"
              placeholder=" "
              formControlName="username"
              [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
            />
            <label for="username">Username</label>

            <div class="invalid-feedback">
              Username is required
            </div>
          </div>

          <!-- Password -->
          <div class="form-floating mb-3">
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder=" "
              formControlName="password"
              [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            />
            <label for="password">Password</label>

            <div class="invalid-feedback">
              Password is required
            </div>
          </div>

          <!-- Submit -->
          <button class="btn btn-warning btn-lg w-100" type="submit">
            Login
          </button>

          <!-- Auth error -->
          <div *ngIf="error" class="text-danger mt-2 text-center">
            ❌ Invalid credentials
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
