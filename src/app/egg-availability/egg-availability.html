<div class="availability-card rounded-3 border border-2" [class.available]="available" [class.unavailable]="!available">
  <div class="content">
    <p *ngIf="available" class="status-text text-success">🥚 Eggs Available</p>
    <p *ngIf="!available" class="status-text text-danger">Sold Out — Order now and we'll notify you when we can fulfill your order</p>
  </div>
</div>
